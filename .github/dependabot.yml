# The comment above each entry says where the package is used and what its
# update needs. Keep them true and specific.
#
# WAIT BEFORE TAKING A RELEASE. Every entry has a `cooldown`: a new version is
# offered only once it is 7 days old, and a new major only once it is 14 days
# old. Most compromised releases are found and withdrawn within that time. A
# security update is offered at once.
version: 2
updates:
  # Swift package graph (Package.swift + Package.resolved): swift-argument-parser
  # and the SwiftLint plugin.
  #
  # The SwiftLint plugin is not grouped: scripts/swiftlint.sh runs `--strict`,
  # so a new rule in a patch release fails format-lint, and that needs to land
  # as its own reviewable PR.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 3

  # Every action is pinned to a full commit SHA with a `# vX.Y.Z` comment. A
  # tag can be moved to new code; a SHA cannot. Dependabot reads the comment
  # and rewrites both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
